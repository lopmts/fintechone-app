name: fintechone
description: "App de finanças pessoais para controle de gastos e investimentos."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.5
  google_fonts: ^8.2.1
  dynamic_color: ^1.8.1
  provider: ^6.1.5+1
  flutter_riverpod: ^2.6.1
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  uuid: ^4.6.0
  http: ^1.6.0
  connectivity_plus: ^7.3.1
  flutter_expandable_fab: ^2.5.2
  dropdown_button2: ^3.1.0
  package_info_plus: ^10.2.1
  flutter_secure_storage: ^11.0.0
  flutter_local_notifications: ^22.3.0

  google_sign_in: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  drift_dev: ^2.34.5
  build_runner: 2.15.1
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "icon_android.png"
  image_path_android: "icon_android.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "icon_android.png"
  adaptive_icon_foreground_inset: 18
  adaptive_icon_monochrome: "icon_android.png"
  ios_content_mode: scaleAspectFill
  remove_alpha_ios: true
  background_color_ios: "#000000"

flutter_native_splash:
  color: "#12151e" # fundo (dá pra usar sua cor "Midnight Slate")
  image: "adaptive_foreground.png" # logo centralizado, PNG com fundo transparente

  color_dark: "#12151e"
  image_dark: "adaptive_foreground.png"

  android_12:
    image: "icon_android.png"
    icon_background_color: "#12151e"
    icon_background_color_dark: "#12151e"

  android: true
  ios: true
  web: false

  fullscreen: true

flutter:
  uses-material-design: true
